# Codemagic backup builder for the sargo XNU kernel.
# Same build as .github/workflows/xnu.yml, for when GitHub's macOS
# runners won't pick the job up. Free tier: 500 macOS M2 minutes/month.
# Trigger manually from the Codemagic UI or API; the workflow runs the
# blacktop darwin-xnu-build script with our sargo patches.
workflows:
  xnu-sargo:
    name: XNU sargo kernel
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: 16.2
      groups:
        - xnu_build
      vars:
        DXB_REPO: https://github.com/blacktop/darwin-xnu-build
        DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
        MACOS_VERSION: "13.5"
        KERNEL_CONFIG: DEVELOPMENT
        MACHINE_CONFIG: SWEET
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: sargo
          include: true
          source: true
    scripts:
      - name: Fetch build script
        script: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh
          ls dxb/patches
      - name: Deps
        script: |
          brew install jq gum bash cmake ninja
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> $CM_ENV
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig
      - name: Build
        script: |
          cd dxb
          export MAKEFLAGS="-k"
          bash build.sh
      - name: Collect kernel
        script: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true
          echo "--- driver check ---"
          strings out/kernel.development.sweet 2>/dev/null | grep -c "SARGO SDHCI" || echo "no SARGO strings"
          strings out/kernel.development.sweet 2>/dev/null | grep -c "SARGO SDHCI rootdev called" || echo "panic string absent (good)"
    artifacts:
      - out/kernel.*
      - out/SHA256SUMS
